[project]
name = "tourmas-datarepo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11.3",
 "requests>=2.33.1",
 "toml",
]

[tool.ruff]
line-length = 80

[tool.ruff.format]
docstring-code-format = true


[dependency-groups]
dev = ["python-lsp-server>=1.12.2", "pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
